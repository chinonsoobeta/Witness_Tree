name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          output: outputs/codeql
          category: /language:${{ matrix.language }}
      - name: Fail on CodeQL findings
        run: node scripts/check-security-scans.mjs --sarif outputs/codeql
      - name: Preserve CodeQL findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-${{ matrix.language }}
          path: outputs/codeql/
          if-no-files-found: error
          retention-days: 30

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the checksummed gitleaks release
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Reject secrets in the full Git history
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact=100 --no-banner --exit-code 1 --report-format json --report-path /tmp/gitleaks-results.json --log-opts="--all" .'
      # The config quiets one entropy heuristic on the SHA-256 digests the evidence
      # records are built from, which is exactly the sort of change that can turn a
      # secret scan into a no-op without anyone noticing. So the scanner is pointed at
      # a directory of planted credentials and required to report every one of them.
      - name: Prove the configured scan still reports planted credentials
        run: node scripts/check-secret-scan-canary.mjs "$RUNNER_TEMP/gitleaks"
      - name: Preserve redacted secret scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-redacted
          path: /tmp/gitleaks-results.json
          if-no-files-found: error
          retention-days: 30

  verify:
    needs: [codeql, secrets]
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install geospatial test dependencies
        run: sudo apt-get update && sudo apt-get install -y gdal-bin python3-gdal python3-numpy zsh
      - run: npm ci
      # The production tree is what a viewer of the site executes, so it is the blocking
      # surface and it is held at high. The build toolchain is audited separately at
      # critical: its advisories are real but reach only this runner and the owner's
      # machine, and the only available fix is a breaking Cloudflare upgrade recorded in
      # docs/DEPENDENCY_AUDIT.md. The third command hides nothing.
      - name: Reject high-severity advisories in shipped dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Reject critical advisories anywhere in the tree
        run: npm audit --audit-level=critical
      - name: Report every dependency advisory, including build tooling
        run: npm audit || true
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run check:bilingual
      - run: npm run check:premise-loss-vocabulary
      - run: npm run check:nrcan-source-currency
      - run: npm run check:interval-release
      - run: npm run check:interval-method
      - run: npm run check:address-lookup
      - run: npm run check:coarse-grid-tiles
      - run: npm run check:district-resolve
      - run: npm run check:shape-measure
      - run: npm run check:ci-check-coverage
      - run: npm run check:security-scans
      - run: npm run check:uptime-alerting
      - run: npm run check:exit-code-taxonomy
      - run: npm run check:cross-record-facts
      - run: npm run check:riding-map-all-intervals
      - run: npm run check:vlce2-gap
      - run: npm run check:province-rollup
      - run: npm run check:hansen-sample-profile
      - run: npm run check:phase4-recovery-trajectory
      - run: npm run check:source-candidates
      - run: npm run check:bc-forest-tenure-foi-catalogue-response
      - run: npm run check:archive-direct-mfa-runners
      - run: npm run check:indian-reserves-authority-access
      - run: npm run check:first-nation-reserves-authority-access
      - run: npm run check:historic-treaties-authority-access
      - run: npm run check:modern-treaties-authority-access
      - run: npm run check:bc-wildfire-current-perimeters
      - run: npm run check:bc-wildfire-geometry-policy
      - run: npm run check:bc-forest-operations-map-access
      - run: npm run check:acquisition-readiness
      - run: npm run check:staged-acquisitions
      - run: npm run check:nrcan-canopy-height-profile
      - run: npm run check:alberta-historical-wildfire-profile
      - run: npm run check:nfdb-poly-current
      - run: npm run check:cwfis-current-active-fires
      - run: npm run check:vlce2-forest-mask-decision
      - run: npm run check:transformation-contract
      - run: npm run check:phase1-geometry-policies
      - run: npm run check:phase1-corruption-corpus
      - run: npm run check:national-baseline-admission
      - run: npm run check:phase0-foundations-exit-status
      - run: npm run check:phase3-frontend-foundation-exit-status
      - run: npm run check:phase1-exit-status
      - run: npm run check:phase1-manifest-retention-iam-applied-record-consistency
      - run: npm run check:phase1-source-ledger-field-audit
      - run: npm run check:phase1-downstream-admission-packet
      - run: npm run check:staged-geospatial-profile
      - run: npm run check:qc-immutable-promotion-iam
      - run: npm run check:qc-fourth-inventory-iam-applied-record-consistency
      - run: npm run check:qc-fourth-inventory-exact-archive-readback
      - run: npm run check:alberta-wildfire-locations
      - run: npm run check:ontario-in-year-fire-perimeters
      - run: npm run check:alberta-plvi-full-release-readiness
      - run: npm run check:alberta-plvi-immutable-promotion-preparation
      - run: npm run check:alberta-plvi-versioned-readback-iam-applied-record-consistency
      - run: npm run check:current-wildfire-immutable-promotion-preparation
      - run: npm run check:current-wildfire-versioned-readback-iam-applied-record-consistency
      - run: npm run check:current-wildfire-exact-raw-archive-capture
      - run: npm run check:phase1-immutable-promotion-readiness
      - run: npm run check:immutable-promotions
      - run: npm run check:boundary-editions
      - run: npm run check:french-boundary-acquisition
      - run: npm run check:phase1-optional-enhancements
      - run: npm run check:phase2-formal-exit-status
      - run: npm run check:phase4-exit-status
      - run: npm run check:phase5-live-wildfire-exit-status
      - run: npm run check:phase6-account-alert-exit-status
      - run: npm run check:phase7-indigenous-explore-comparison-exit-status
      - run: npm run check:phase8-launch-readiness-exit-status
      - run: npm run check:site-hosting-capability-probe
      - run: npm run check:phase8-province-map-release
      # The repository half of the deployed-Site render observation. The run
      # itself needs a browser and the public origin, so it is done by hand;
      # this fails when the record is missing, records a failure, or has gone
      # stale because a file it bound has changed since the Site was observed.
      - run: npm run check:deployed-map-render
      - run: npm run check:deployed-revision-markers
      - run: npm run check:maplibre-worker-asset
      - name: Independently retrieve the Phase 8 bulk release
        run: node scripts/check-phase8-bulk-download-independent-retrieval.mjs --output /tmp/phase8-bulk-download-independent-retrieval.json
      - name: Preserve the independent Phase 8 retrieval receipt
        uses: actions/upload-artifact@v7
        with:
          name: phase8-bulk-download-independent-retrieval
          path: /tmp/phase8-bulk-download-independent-retrieval.json
          if-no-files-found: error
          retention-days: 30
      - run: npm run check:bulk-download-publication
      - run: npm run check:phase9-public-beta-launch-exit-status
      - run: npm run check:elections-canada-fed-2025
      - run: npm run check:elections-canada-fed-2025-promotion
      - run: npm run check:federal-electoral-archive-recovery-evidence
      - run: npm run check:raster-grid
      - run: npm run check:phase2-v21-raster-contract
      - run: npm run check:phase2-v21-raster-readback
      - run: npm run check:phase2-zonal-aggregation
      - run: npm run check:phase2-per-cell-geometry
      - run: npm run check:phase2-per-cell-annual-series
      - run: npm run check:phase2-province-series
      - run: npm run check:bc-ften-cutblock-corroboration
      # The repository half of the BC endpoint comparison. The probe itself
      # needs the two BC services, so it is run by hand; this validates the
      # committed observation and keeps it from claiming an authoritative
      # endpoint that BC does not name.
      - run: npm run check:bc-ften-endpoint-divergence
      - run: npm run check:boundary-overlays
      - run: npm run check:phase2-v21-province-zonal-pilot
      - run: npm run check:phase2-expert-review-workflow
      - run: npm run check:phase2-validation-comparison
      - run: node --test tests/phase2-historical-evidence-status.test.mjs
      - run: npm run check:phase2-historical-method-parameters
      - run: npm run check:phase2-historical-component-inventory
      - run: node --test tests/phase2-real-data-owner-decision.test.mjs tests/phase2-real-national-preflight.test.mjs tests/phase2-real-national-execution-evidence.test.mjs
      # Checkers that validate an owner admission. Each of these binds bytes an
      # owner approved, so a change that silently voids an approval must fail the
      # branch gate rather than be discovered at execution time.
      - run: npm run check:phase1-bc-copyright-permission-form-package
      - run: npm run check:phase1-immutable-downstream-preflight
      - run: npm run check:current-wildfire-owner-admission
      - run: npm run check:phase1-alberta-transform-ingestion-audit
      - run: npm run check:phase1-transformation-scope-owner-approval
      - run: npm run check:qc-stand-copy-production-admission-readiness
      - run: npm run check:phase1-ntems-transform
      - run: npm run check:phase1-ntems-resume
      - run: npm run check:phase1-ntems-production-admission-readiness
      - run: npm run check:phase1-owner-approval-packet
      - run: npm run check:qc-immutable-promotion-preparation
      - run: npm run check:federal-electoral-promotion-gates
      - run: npm run check:phase2-owner-admission-packet
      - run: npm run check:phase2-admission-record-template
      - run: npm run check:phase2-independent-comparison-evidence
      - run: npm run check:phase2-official-published-harvest-contract
      - run: npm run check:phase2-official-published-harvest-receipt
      - run: node --import tsx --test tests/official-published-harvest-page.test.tsx
      # Reads only repository records: no data root, no AWS call, no write path.
      - run: npm run check:raw-archive-reproduction-drill
      # Static half of the data-root inventory: it proves every inventoried
      # check still exists, so a rename cannot quietly shrink the list of
      # checks known to be unverifiable without the drive. The completeness
      # half (--empirical) is only decidable with the data root detached and
      # is run by hand, not here.
      - run: npm run check:data-root-bound-checks
      - run: npm run check:data-root-coverage
      - run: npm run check:source-review
      - run: npm run check:accessibility
      - run: npm run build
      # The unit suite. CI previously ran four named test files, so the other 186
      # could fail on main indefinitely, and #62 merged green while leaving three
      # tests pinning exit-criteria counts it had just changed. This runs every
      # test file except the three that read the owner's data root, which is named
      # in scripts/run-ci-tests.mjs with the reason for each. It follows the build
      # because the rendered-HTML tests import the build output.
      - run: npm run test:suite
      - name: Preserve explicit test availability
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-test-availability
          path: outputs/test-run-*.json
          if-no-files-found: error
          retention-days: 30
      # Nothing above can run the 25 data-root-bound tests, so this gate checks
      # instead that they are not stale: it recomputes each one's guarded file set
      # from the tree and compares it to the receipt of the owner's last local run.
      # #84 edited the NTEMS runner and four owner-bound execution authorizations
      # and merged green because the only test reading them needs the SSD.
      - run: npm run check:data-root-test-currency
      - run: npm run check:claims
      - run: npm run check:style-tokens
      - run: npm run check:contrast
      - run: npm run check:hex-literals
      - run: npm run check:year-range-format
      - run: npm run check:brand-token
      - run: npm run check:persistent-identifiers
      - run: npm run check:budgets
      - name: Install the rendered-browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Gate WCAG 2.2 AA across bilingual routes and themes
        run: npm run test:playwright
      - name: Preserve accessibility observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: automated-accessibility-evidence
          path: outputs/playwright/
          if-no-files-found: error
          retention-days: 30
      - name: Require successful security scans
        if: always()
        env:
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: |
          test "$CODEQL_RESULT" = success
          test "$SECRETS_RESULT" = success
      # The complete suite includes owner-local macOS safety runners and large
      # checksum-bound artifacts. It is a required local release gate; the
      # portable contract suites above remain the Ubuntu branch gate.
      #
      # Nine owner-admission checkers stay out of this branch gate because they
      # read the local data root, which holds payloads no CI runner has:
      # check:phase1-remaining-actions-audit, check:phase1-phase3-owner-approvals,
      # check:phase1-source-ledger-decision-readiness,
      # check:phase1-current-state-completion-audit, check:phase1-bc-ontario-row-audit,
      # check:phase1-owner-decision-queue, check:phase1-federal-electoral-transformation,
      # check:phase1-federal-electoral-production-admission and
      # check:phase2-historical-national-execution. They remain required local
      # release gates and are the reason the local suite is not optional.
      # Their staleness, however, is no longer invisible: see
      # check:data-root-test-currency above.
