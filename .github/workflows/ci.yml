name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: node scripts/check-bilingual.mjs
      - run: npm run check:source-candidates
      - run: npm run check:indian-reserves-authority-access
      - run: npm run check:first-nation-reserves-authority-access
      - run: npm run check:historic-treaties-authority-access
      - run: npm run check:modern-treaties-authority-access
      - run: npm run check:bc-wildfire-current-perimeters
      - run: npm run check:bc-wildfire-geometry-policy
      - run: npm run check:bc-forest-operations-map-access
      - run: npm run check:acquisition-readiness
      - run: npm run check:staged-acquisitions
      - run: npm run check:nrcan-canopy-height-profile
      - run: npm run check:alberta-historical-wildfire-profile
      - run: npm run check:nfdb-poly-current
      - run: npm run check:cwfis-current-active-fires
      - run: npm run check:phase1-corruption-corpus
      - run: npm run check:staged-geospatial-profile
      - run: npm run check:alberta-wildfire-locations
      - run: npm run check:ontario-in-year-fire-perimeters
      - run: npm run check:alberta-plvi-full-release-readiness
      - run: npm run check:alberta-plvi-immutable-promotion-preparation
      - run: npm run check:current-wildfire-immutable-promotion-preparation
      - run: npm run check:phase1-immutable-promotion-readiness
      - run: npm run check:immutable-promotions
      - run: npm run check:boundary-editions
      - run: npm run check:elections-canada-fed-2025
      - run: npm run check:elections-canada-fed-2025-promotion
      - run: npm run check:raster-grid
      - run: npm run check:phase2-method-parameters
      - run: npm run check:phase2-national-baseline-batch
      - run: npm run check:phase2-synthetic-integration
      - run: npm run check:accessibility
      - run: npm run build
      - run: npm run check:claims
      - run: npm run check:style-tokens
      - run: npm run check:brand-token
      - run: npm run check:budgets
      - run: npm run test:unit
