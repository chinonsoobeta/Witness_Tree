name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: node scripts/check-bilingual.mjs
      - run: npm run check:accessibility
      - run: npm run build
      - run: npm run check:claims
      - run: npm run check:style-tokens
      - run: npm run check:budgets
      - run: npm run test:unit
