name: Synthetic uptime

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe bilingual public routes
        run: node scripts/run-synthetic-uptime.mjs --origin https://www.witnesstree.ca --output synthetic-uptime-result.json
      - name: Preserve the run receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-uptime-result
          path: synthetic-uptime-result.json
          if-no-files-found: error
          retention-days: 90
