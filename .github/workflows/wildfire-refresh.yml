name: Wildfire refresh

on:
  # One entry per UTC slot, not one expression listing eight hours: GitHub reports
  # the expression that triggered a run, so separate entries are what let the gate
  # recover which slot a late run belongs to. Minute 17 rather than 0 because
  # runs scheduled on the hour are the ones GitHub delays and drops under load.
  schedule:
    - cron: '17 0 * * *'
    - cron: '17 4 * * *'
    - cron: '17 5 * * *'
    - cron: '17 12 * * *'
    - cron: '17 13 * * *'
    - cron: '17 19 * * *'
    - cron: '17 20 * * *'
    - cron: '17 23 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: gate
        run: node scripts/wildfire/dst-gate.mjs
        env:
          WILDFIRE_SCHEDULED_CRON: ${{ github.event.schedule }}
      - id: refresh
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/wildfire/refresh.mjs
        env:
          WILDFIRE_DATA_DIR: public/wildfire
          WILDFIRE_SOURCE_URLS: ${{ vars.WILDFIRE_SOURCE_URLS }}
      - id: retry
        if: steps.gate.outputs.run == 'true' && steps.refresh.outcome == 'failure'
        continue-on-error: true
        run: sleep 900 && node scripts/wildfire/refresh.mjs
        env:
          WILDFIRE_DATA_DIR: public/wildfire
          WILDFIRE_SOURCE_URLS: ${{ vars.WILDFIRE_SOURCE_URLS }}
      - name: Open a pull request for refreshed files
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/wildfire
          if git diff --cached --quiet; then
            exit 0
          fi
          BRANCH="automation/wildfire-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git commit -m 'chore: refresh wildfire data'
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title 'chore: refresh wildfire data' \
            --body "Automated output from workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
      - if: steps.gate.outputs.run == 'true' && steps.refresh.outcome == 'failure' && steps.retry.outcome == 'failure'
        run: exit 1
