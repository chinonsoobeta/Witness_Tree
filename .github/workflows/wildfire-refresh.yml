name: Wildfire refresh

on:
  # One entry per UTC slot, not one expression listing eight hours: GitHub reports
  # the expression that triggered a run, so separate entries are what let the gate
  # recover which slot a late run belongs to. Minute 17 rather than 0 because
  # runs scheduled on the hour are the ones GitHub delays and drops under load.
  schedule:
    - cron: '17 0 * * *'
    - cron: '17 4 * * *'
    - cron: '17 5 * * *'
    - cron: '17 12 * * *'
    - cron: '17 13 * * *'
    - cron: '17 19 * * *'
    - cron: '17 20 * * *'
    - cron: '17 23 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    # Refreshed data goes to the Canadian raw archive and a status object, never back
    # into this repository, so the job needs no write access to it. id-token lets the
    # job trade a short-lived GitHub OIDC token for the archive role; no key is stored.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: gate
        run: node scripts/wildfire/dst-gate.mjs
        env:
          WILDFIRE_SCHEDULED_CRON: ${{ github.event.schedule }}
      - id: refresh
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/wildfire/refresh.mjs
        env:
          WILDFIRE_DATA_DIR: public/wildfire
          WILDFIRE_SOURCE_URLS: ${{ vars.WILDFIRE_SOURCE_URLS }}
      - id: retry
        if: steps.gate.outputs.run == 'true' && steps.refresh.outcome == 'failure'
        continue-on-error: true
        run: sleep 900 && node scripts/wildfire/refresh.mjs
        env:
          WILDFIRE_DATA_DIR: public/wildfire
          WILDFIRE_SOURCE_URLS: ${{ vars.WILDFIRE_SOURCE_URLS }}
      - id: archive-role
        name: Require the archive role
        if: steps.gate.outputs.run == 'true' && (steps.refresh.outcome == 'success' || steps.retry.outcome == 'success')
        env:
          WILDFIRE_ARCHIVE_ROLE_ARN: ${{ vars.WILDFIRE_ARCHIVE_ROLE_ARN }}
        run: |
          if [ -z "$WILDFIRE_ARCHIVE_ROLE_ARN" ]; then
            echo '::error::WILDFIRE_ARCHIVE_ROLE_ARN is not set, so a successful refresh cannot be archived.'
            exit 1
          fi
      - name: Assume the archive role
        if: steps.archive-role.outcome == 'success'
        # v6.2.4, pinned by commit because this step receives cloud credentials.
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.WILDFIRE_ARCHIVE_ROLE_ARN }}
          aws-region: ca-central-1
          role-session-name: wildfire-refresh-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Archive the refreshed snapshots and publish their status
        if: steps.archive-role.outcome == 'success'
        run: node scripts/wildfire/archive-upload.mjs
        env:
          WILDFIRE_DATA_DIR: public/wildfire
          # Required, with no default in the uploader, and checked against the recorded owner approval.
          WILDFIRE_ARCHIVE_RETENTION_MODE: COMPLIANCE
          WILDFIRE_ARCHIVE_RETAIN_UNTIL: '2033-08-12T00:00:00Z'
          WILDFIRE_DELIVERY_BUCKET: witness-tree-public-delivery-ca-central-1
      - if: steps.gate.outputs.run == 'true' && steps.refresh.outcome == 'failure' && steps.retry.outcome == 'failure'
        run: exit 1
