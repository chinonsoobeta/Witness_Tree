AWSTemplateFormatVersion: "2010-09-09"
Description: Witness Tree public derived-artifact delivery; never an origin for the raw archive.

Resources:
  DeliveryBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: witness-tree-public-delivery-ca-central-1
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  DeliveryOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: witness-tree-public-delivery-oac
        Description: SigV4 access to the isolated public-delivery bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DeliveryCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: witness-tree-immutable-public-artifacts-v1
        Comment: Cache content-addressed PMTiles without cookies or query strings
        DefaultTTL: 31536000
        MaxTTL: 31536000
        MinTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: false
          EnableAcceptEncodingGzip: false
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  DeliveryCorsPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: witness-tree-public-artifact-cors-v1
        Comment: Credentialless browser access to public immutable artifacts
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items:
              - Range
          AccessControlAllowMethods:
            Items:
              - GET
              - HEAD
          AccessControlAllowOrigins:
            Items:
              - "*"
          AccessControlExposeHeaders:
            Items:
              - Accept-Ranges
              - Content-Length
              - Content-Range
              - ETag
          AccessControlMaxAgeSec: 86400
          OriginOverride: true

  DeliveryDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Witness Tree public derived-artifact delivery
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: delivery-s3
            DomainName: !GetAtt DeliveryBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt DeliveryOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: delivery-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: !Ref DeliveryCachePolicy
          ResponseHeadersPolicyId: !Ref DeliveryCorsPolicy
          Compress: false
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021

  DeliveryBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeliveryBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DeliveryBucket.Arn
              - !Sub "${DeliveryBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: AllowExactCloudFrontDistributionRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${DeliveryBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DeliveryDistribution}"
          - Sid: DenyUnconditionalReleaseWrites
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${DeliveryBucket.Arn}/releases/*"
            Condition:
              "Null":
                s3:if-none-match: "true"
              Bool:
                s3:ObjectCreationOperation: "true"
          - Sid: DenyReleaseDeletion
            Effect: Deny
            Principal: "*"
            Action:
              - s3:DeleteObject
              - s3:DeleteObjectVersion
            Resource: !Sub "${DeliveryBucket.Arn}/releases/*"

Outputs:
  BucketName:
    Value: !Ref DeliveryBucket
  DistributionId:
    Value: !Ref DeliveryDistribution
  DistributionDomainName:
    Value: !GetAtt DeliveryDistribution.DomainName
